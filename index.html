<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Capsule - new tab page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="header">
<a href="#" class="logo" id="homeBtn">TIME CAPSULE</a>
<button class="settings-btn" id="settingsBtn">Settings</button>
</header>
<div class="browser-tabs" id="browserTabs">
<button class="browser-tab active" data-tab="home"><span>Home</span></button>
<button class="new-tab-btn" id="newTabBtn">+</button>
</div>
<div class="page active-page" id="homePage">
<section class="time-section">
<p id="date">Monday, September 15</p>
<h1 id="clock">00:00</h1>
</section>
<section class="search-section">
<form id="searchForm"><span class="search-icon">⌕</span>
<input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
<button type="submit">Go</button>
</form>
</section>
<section class="links-section">
<div class="section-heading"><p class="eyebrow">Quick links</p><button id="addLinkBtn">+</button></div>
<div class="quick-links" id="quickLinks">
<a class="link-card" href="#" target="_self"><div class="link-icon"><img src="gh.png" alt="GitHub" style="width:100%;height:100%;object-fit:contain"></div><strong>GitHub</strong></a>
<a class="link-card" href="#" target="_self"><div class="link-icon"><img src="yt.png" alt="YouTube" style="width:100%;height:100%;object-fit:contain"></div><strong>YouTube</strong></a>
<a class="link-card" href="#" target="_self"><div class="link-icon"><img src="hc.jpg" alt="Hack Club" style="width:100%;height:100%;object-fit:contain"></div><strong>Hack Club</strong></a>
<a class="link-card" href="#" target="_self"><div class="link-icon"><img src="vercel.jpg" alt="Vercel" style="width:100%;height:100%;object-fit:contain"></div><strong>Vercel</strong></a>
</div>
</section>
<section class="productivity-section">
<div class="section-heading">
<p class="eyebrow">Tasks</p>
<span id="taskCount">0 / 0</span>
</div>
<div class="task-input"><input type="text" id="taskInput" placeholder="Add task..."><button id="addTaskBtn">+</button></div>
<div class="task-list" id="taskList"></div>
</section>
<section class="capsules-section">
<div class="section-heading">
<p class="eyebrow">Capsules</p>
<button id="newCapsuleBtn">+ New</button>
</div>
<div class="capsule-list" id="capsuleList"></div>
</section>
</div>
<div class="page internal-page" id="internalPage">
<div class="internal-header">
<button id="backHomeBtn">← Home</button>
<span id="internalTitle">New Tab</span>
</div>
<div class="internal-content" id="internalContent"><p>Select an internal tab to continue.</p></div>
</div>
<div class="modal hidden" id="capsuleModal">
<div class="modal-content">
<button class="modal-close" id="closeCapsuleModal">×</button>
<h2>New time capsule</h2>
<textarea id="messageInput" placeholder="Write something..." maxlength="300"></textarea>
<label for="unlockDate">Unlock date</label>
<input type="datetime-local" id="unlockDate">
<button id="sealBtn">Seal</button>
</div>
</div>
<div class="modal hidden" id="messageModal">
<div class="modal-content">
<button class="modal-close" id="closeMessageModal">×</button>
<h2>Capsule</h2>
<blockquote id="unlockedMessage"></blockquote>
<button id="deleteCapsuleBtn">Delete</button>
</div>
</div>
<aside class="settings-panel hidden" id="settingsPanel">
<div class="settings-header"><h2>Settings</h2><button id="closeSettingsBtn">×</button></div>
<label for="themeSelect">Theme
<select id="themeSelect"><option value="dark">Dark</option><option value="light">Light</option></select>
</label>
</aside>
<div class="modal hidden" id="linkModal">
<div class="modal-content">
<button class="modal-close" id="closeLinkModal">×</button>
<h2>Add link</h2>
<input type="text" id="linkName" placeholder="Name">
<input type="url" id="linkUrl" placeholder="https://example.com">
<button id="saveLinkBtn">Add</button>
</div>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
